services:

  corba-nameservice:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: corba-nameservice
    ports:
      - "1050:1050"
    environment:
      CORBA_PUBLIC_HOST: ${CORBA_PUBLIC_HOST}

  medisync-server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: medisync-server
    depends_on:
      - corba-nameservice
    ports:
      - "2809:2809"
    environment:
      CORBA_PUBLIC_HOST: ${CORBA_PUBLIC_HOST}
      HOSPITAL_TIMEZONE: ${HOSPITAL_TIMEZONE:-Africa/Maputo}
    volumes:
      - ./src/main/resources:/app/src/main/resources